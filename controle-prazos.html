<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle de Prazos - Circular 01/2026-SEMASDH</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 20px;
    }

    .container {
        max-width: 650px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
    }

    button {
        margin-top: 15px;
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }

    .resultado {
        margin-top: 20px;
        background: #eef3f7;
        padding: 15px;
        border-radius: 8px;
        line-height: 1.6;
    }

    .linha-topo {
    margin-bottom: 15px;
    }
    
    .grid-resultados {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    
    .coluna {
        background: #f9fbfd;
        padding: 10px;
        border-radius: 8px;
    }
    
    .titulo {
        text-align: center;
        font-weight: bold;
        margin-bottom: 10px;
    }
    
    .linha-final {
        margin-top: 20px;
        text-align: center;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Controle de Prazos</h2>

    <label>📅 Data de recebimento</label>
    <input type="date" id="dataRecebimento">

    <label>⏳ Prazo externo (dias)</label>
    <input type="number" id="prazoExterno">

    <button onclick="calcular()">Calcular</button>

    <div class="resultado" id="resultado"></div>
</div>

<script>

// Criar data corretamente no fuso local
function criarDataLocal(dataString) {
    let partes = dataString.split("-");
    return new Date(partes[0], partes[1] - 1, partes[2]);
}

// Adicionar dias úteis
function adicionarDiasUteis(data, dias) {
    let resultado = new Date(data);
    let adicionados = 0;

    while (adicionados < dias) {
        resultado.setDate(resultado.getDate() + 1);
        let diaSemana = resultado.getDay();

        if (diaSemana !== 0 && diaSemana !== 6) {
            adicionados++;
        }
    }
    return resultado;
}

// Adicionar dias corridos
function adicionarDiasCorridos(data, dias) {
    let resultado = new Date(data);
    resultado.setDate(resultado.getDate() + dias);
    return resultado;
}

// Dias úteis entre datas
function diasUteisEntre(inicio, fim) {
    let count = 0;
    let data = new Date(inicio);

    while (data < fim) {
        data.setDate(data.getDate() + 1);
        let diaSemana = data.getDay();

        if (diaSemana !== 0 && diaSemana !== 6) {
            count++;
        }
    }
    return count;
}

// Dias corridos entre datas
function diasCorridosEntre(inicio, fim) {
    const diff = fim - inicio;
    return Math.ceil(diff / (1000 * 60 * 60 * 24));
}

function calcular() {
    let dataRecebimentoStr = document.getElementById("dataRecebimento").value;
    let prazoExterno = parseInt(document.getElementById("prazoExterno").value);

    if (!dataRecebimentoStr || !prazoExterno) {
        alert("Preencha todos os campos!");
        return;
    }

    let dataInicial = criarDataLocal(dataRecebimentoStr);

    // === REGRAS DA CIRCULAR ===
    let prazoInterno;
    let regra;

    if (prazoExterno > 20) {
        prazoInterno = prazoExterno - 5;
        regra = "Ordinário: resposta até 5 dias antes do prazo externo.";
    } else if (prazoExterno >= 10) {
        prazoInterno = prazoExterno - 3;
        regra = "Prioritário: resposta até 3 dias antes do prazo externo.";
    } else {
        prazoInterno = 2;
        regra = "Urgente: resposta em até 48 horas.";
    }

    // === CÁLCULO DIAS ÚTEIS ===
    let dataFinalUtil = adicionarDiasUteis(dataInicial, prazoExterno);
    let dataLimiteUtil = adicionarDiasUteis(dataInicial, prazoInterno);

    // === CÁLCULO DIAS CORRIDOS ===
    let dataFinalCorrido = adicionarDiasCorridos(dataInicial, prazoExterno);
    let dataLimiteCorrido = adicionarDiasCorridos(dataInicial, prazoInterno);

    // Hoje
    let hoje = new Date();
    hoje.setHours(0,0,0,0);

    let diasUteisRestantes = diasUteisEntre(hoje, dataLimiteUtil);
    let diasCorridosRestantes = diasCorridosEntre(hoje, dataLimiteCorrido);

    function formatar(data) {
        return data.toLocaleDateString("pt-BR");
    }

    document.getElementById("resultado").innerHTML = `
            <div class="linha-topo">
                <p><strong>📅 Data de recebimento:</strong> ${formatar(dataInicial)}</p>
            </div>
        
            <div class="grid-resultados">
        
                <div class="coluna">
                    <p class="titulo">Cálculo em dias úteis</p>
                    <p><strong>⏳ Prazo externo final:</strong> ${formatar(dataFinalUtil)}</p>
                    <p><strong>⚠️ Data limite:</strong> ${formatar(dataLimiteUtil)}</p>
                    <p><strong>⚠️ Dias restantes:</strong> ${diasUteisRestantes}</p>
                </div>
        
                <div class="coluna">
                    <p class="titulo">Cálculo em dias corridos</p>
                    <p><strong>⏳ Prazo externo final:</strong> ${formatar(dataFinalCorrido)}</p>
                    <p><strong>⚠️ Data limite:</strong> ${formatar(dataLimiteCorrido)}</p>
                    <p><strong>⚠️ Dias restantes:</strong> ${diasCorridosRestantes}</p>
                </div>
        
            </div>
        
            <div class="linha-final">
                <p class="titulo">Regra aplicada</p>
                <p>${regra}</p>
            </div>
    `;
}

</script>

<footer>
    <p style="text-align:center;"><a href="index.html">Retornar</a>
</p></footer>

</body>
    
</html>
