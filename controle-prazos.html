<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Controle de Prazos - Circular 01/2026-SEMASDH</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 20px;
    }

    .container {
        max-width: 650px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
    }

    button {
        margin-top: 15px;
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }

    .resultado {
        margin-top: 20px;
        background: #eef3f7;
        padding: 15px;
        border-radius: 8px;
        line-height: 1.6;
    }

    .linha-topo {
        margin-bottom: 15px;
    }
    
    
    .coluna {
        border-radius: 8px;
        overflow: hidden;
        background: #f9fbfd;
    }
    
    .titulo {
        text-align: center;
        font-weight: bold;
        margin-bottom: 10px;
        font-weight: bold;
    }
    
    .linha-final {
        margin-top: 20px;
        text-align: center;
    }

    .cabecalho {
        background: #007bff; /* mesma cor do botão */
        color: white;
        text-align: center;
        font-weight: bold;
        padding: 10px;
    }        

    .linha-topo {
        margin-bottom: 15px;
    }
    
    .conteudo {
        padding: 10px;
    }    
</style>
</head>

<body>

<div class="container">
    <p><a href="index.html">Início</a></p>
    <h2>Controle de Prazos</h2>

    <label>📅 Data de recebimento</label>
    <input type="date" id="dataRecebimento">

    <label>⏳ Prazo externo (dias)</label>
    <input type="number" id="prazoExterno">

    <button onclick="calcular()">Calcular</button>

    <div class="resultado" id="resultado"></div>
</div>

<script>

// Criar data no padrão local (sem bug de fuso)
function criarDataLocal(dataString) {
    let [ano, mes, dia] = dataString.split("-");
    let data = new Date(ano, mes - 1, dia);
    data.setHours(0,0,0,0);
    return data;
}

// Zerar hora
function zerarHora(data) {
    let d = new Date(data);
    d.setHours(0,0,0,0);
    return d;
}

// Adicionar dias úteis
function adicionarDiasUteis(data, dias) {
    let resultado = new Date(data);
    let count = 0;

    while (count < dias) {
        resultado.setDate(resultado.getDate() + 1);
        let dia = resultado.getDay();
        if (dia !== 0 && dia !== 6) count++;
    }

    return zerarHora(resultado);
}

// Adicionar dias corridos
function adicionarDiasCorridos(data, dias) {
    let resultado = new Date(data);
    resultado.setDate(resultado.getDate() + dias);
    return zerarHora(resultado);
}

// 🔥 DIFERENÇA REAL EM DIAS CORRIDOS (CORRETO)
function diferencaDiasCorridos(inicio, fim) {
    let i = zerarHora(inicio);
    let f = zerarHora(fim);

    return Math.max(0, Math.round((f - i) / (1000 * 60 * 60 * 24)));
}

// 🔥 DIFERENÇA REAL EM DIAS ÚTEIS (CORRETO)
function diferencaDiasUteis(inicio, fim) {
    let count = 0;
    let data = zerarHora(inicio);

    while (data < fim) {
        data.setDate(data.getDate() + 1);
        let dia = data.getDay();

        if (dia !== 0 && dia !== 6) {
            count++;
        }
    }

    return count;
}

function calcular() {
    let dataRecebimentoStr = document.getElementById("dataRecebimento").value;
    let prazoExterno = parseInt(document.getElementById("prazoExterno").value);

    if (!dataRecebimentoStr || !prazoExterno) {
        alert("Preencha todos os campos!");
        return;
    }

    let dataInicial = criarDataLocal(dataRecebimentoStr);

    // Regras
    let prazoInterno;
    let regra;

    if (prazoExterno > 20) {
        prazoInterno = prazoExterno - 5;
        regra = "Ordinário: resposta até 5 dias antes do prazo externo.";
    } else if (prazoExterno >= 10) {
        prazoInterno = prazoExterno - 3;
        regra = "Prioritário: resposta até 3 dias antes do prazo externo.";
    } else {
        prazoInterno = 2;
        regra = "Urgente: resposta em até 48 horas.";
    }

    // Datas
    let dataFinalUtil = adicionarDiasUteis(dataInicial, prazoExterno);
    let dataLimiteUtil = adicionarDiasUteis(dataInicial, prazoInterno);

    let dataFinalCorrido = adicionarDiasCorridos(dataInicial, prazoExterno);
    let dataLimiteCorrido = adicionarDiasCorridos(dataInicial, prazoInterno);

    let hoje = zerarHora(new Date());

    // 
    let diasCorridosRestantes = diferencaDiasCorridos(hoje, dataLimiteCorrido);
    
    if(diasCorridosRestantes === 0){
      diasCorridosRestantes = 'resposta em até 48 horas';
    }

    let diasUteisRestantes = diferencaDiasUteis(hoje, dataLimiteUtil);

    function formatar(data) {
        return data.toLocaleDateString("pt-BR");
    }

    document.getElementById("resultado").innerHTML = `
        <div class="linha-topo">
            
        </div>

            <div class="coluna">
                <div class="cabecalho">Cálculo em dias</div>
                <div class="conteudo">
                    <p><strong>⏳ Prazo final para resposta ao demandante:</strong> ${formatar(dataFinalCorrido)}</p>
                    <p><strong>⚠️ Data limite conforme Circular nº 01/2026:</strong> ${formatar(dataLimiteCorrido)}</p>
                    <p><strong>📅 Dias corridos restantes:</strong> ${diasCorridosRestantes}</p>
                </div>
            </div>


        <div class="linha-final">
            <p class="titulo">Regra aplicada</p>
            <p>${regra}</p>
        </div>
    `;
}

</script>


</body>
    
</html>
